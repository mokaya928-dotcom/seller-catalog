<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff1f2" />
      <stop offset="100%" stop-color="#ffe4e6" />
    </linearGradient>
    <linearGradient id="stick" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fb7185" />
      <stop offset="40%" stop-color="#fda4af" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>
    <linearGradient id="cap" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="35%" stop-color="#fb7185" />
      <stop offset="100%" stop-color="#be123c" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#881337" flood-opacity="0.22" />
    </filter>
  </defs>
  <rect width="500" height="500" fill="url(#bg)" rx="24" />
  <!-- Studio Pedestal -->
  <ellipse cx="250" cy="405" rx="160" ry="32" fill="#fecdd3" opacity="0.6" />
  <ellipse cx="250" cy="400" rx="110" ry="18" fill="#e11d48" opacity="0.15" />

  <g filter="url(#shadow)">
    <!-- Exposed Balm Core -->
    <path d="M 215 160 C 215 130, 285 130, 285 160 L 285 185 L 215 185 Z" fill="url(#stick)" />

    <!-- Turning ring -->
    <rect x="210" y="180" width="80" height="15" rx="3" fill="#e5e7eb" />
    <rect x="210" y="195" width="80" height="18" fill="#d1d5db" />

    <!-- Tube Body -->
    <rect x="200" y="213" width="100" height="175" rx="16" fill="url(#cap)" />

    <!-- Minimal Tube Label -->
    <rect x="210" y="240" width="80" height="120" rx="8" fill="#ffffff" />
    <text x="250" y="270" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#e11d48" text-anchor="middle" letter-spacing="2">LIP GLOW</text>
    <text x="250" y="295" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">BALM</text>
    <line x1="225" y1="305" x2="275" y2="305" stroke="#f43f5e" stroke-width="2" />
    <text x="250" y="325" font-family="system-ui, sans-serif" font-size="8" font-weight="600" fill="#4b5563" text-anchor="middle">BERRY TINT</text>
    <text x="250" y="342" font-family="system-ui, sans-serif" font-size="7" font-weight="500" fill="#9ca3af" text-anchor="middle">SPF 15 • 4.5G</text>

    <!-- Highlight -->
    <path d="M 210 225 L 210 375" stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity="0.6" />
  </g>
  <!-- Mini kiss/heart -->
  <path d="M 350 220 C 350 210, 360 200, 372 205 C 384 200, 394 210, 394 220 C 394 235, 372 245, 372 250 C 372 245, 350 235, 350 220 Z" fill="#fb7185" opacity="0.8" />
</svg>
