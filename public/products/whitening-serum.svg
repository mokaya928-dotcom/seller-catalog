<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdf4ff" />
      <stop offset="100%" stop-color="#fae8ff" />
    </linearGradient>
    <linearGradient id="glass" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e9d5ff" />
      <stop offset="30%" stop-color="#ffffff" />
      <stop offset="70%" stop-color="#f3e8ff" />
      <stop offset="100%" stop-color="#d8b4fe" />
    </linearGradient>
    <linearGradient id="liquid" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="50%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#9333ea" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#581c87" flood-opacity="0.25" />
    </filter>
  </defs>
  <rect width="500" height="500" fill="url(#bg)" rx="24" />
  <!-- Studio Pedestal -->
  <ellipse cx="250" cy="410" rx="170" ry="35" fill="#f0abfc" opacity="0.4" />
  <ellipse cx="250" cy="405" rx="130" ry="20" fill="#9333ea" opacity="0.15" />

  <g filter="url(#shadow)">
    <!-- Dropper Pipette Top -->
    <rect x="235" y="80" width="30" height="40" rx="12" fill="#374151" />
    <rect x="220" y="115" width="60" height="25" rx="5" fill="#e5e7eb" />
    <rect x="225" y="135" width="50" height="30" fill="#9ca3af" />
    
    <!-- Bottle Body -->
    <rect x="180" y="165" width="140" height="230" rx="28" fill="url(#glass)" />
    <!-- Serum Liquid inside -->
    <rect x="190" y="210" width="120" height="175" rx="20" fill="url(#liquid)" opacity="0.85" />
    
    <!-- Label -->
    <rect x="195" y="240" width="110" height="110" rx="10" fill="#ffffff" />
    <text x="250" y="270" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#6b21a8" text-anchor="middle" letter-spacing="2">GLOW</text>
    <text x="250" y="295" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1f2937" text-anchor="middle">SERUM</text>
    <line x1="215" y1="305" x2="285" y2="305" stroke="#a855f7" stroke-width="2" />
    <text x="250" y="325" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#6b7280" text-anchor="middle">NIACINAMIDE 10%</text>
    <text x="250" y="340" font-family="system-ui, sans-serif" font-size="8" font-weight="500" fill="#9ca3af" text-anchor="middle">30 ML / 1.0 FL OZ</text>

    <!-- Glass Reflection Highlight -->
    <rect x="190" y="175" width="14" height="210" rx="7" fill="#ffffff" opacity="0.6" />
  </g>

  <!-- Sparkles -->
  <path d="M 140 180 Q 140 195 125 195 Q 140 195 140 210 Q 140 195 155 195 Q 140 195 140 180" fill="#c084fc" />
  <path d="M 370 230 Q 370 245 355 245 Q 370 245 370 260 Q 370 245 385 245 Q 370 245 370 230" fill="#a855f7" />
</svg>
