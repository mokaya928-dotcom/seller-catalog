<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdf2f8" />
      <stop offset="100%" stop-color="#fce7f3" />
    </linearGradient>
    <linearGradient id="silver" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d1d5db" />
      <stop offset="35%" stop-color="#f3f4f6" />
      <stop offset="60%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#9ca3af" />
    </linearGradient>
    <linearGradient id="jar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbcfe8" />
      <stop offset="50%" stop-color="#fdf2f8" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#831843" flood-opacity="0.22" />
    </filter>
  </defs>
  <rect width="500" height="500" fill="url(#bg)" rx="24" />
  <!-- Studio Pedestal -->
  <ellipse cx="250" cy="400" rx="190" ry="38" fill="#fbcfe8" opacity="0.5" />
  <ellipse cx="250" cy="395" rx="140" ry="22" fill="#db2777" opacity="0.15" />

  <g filter="url(#shadow)">
    <!-- Jar Lid -->
    <rect x="150" y="170" width="200" height="50" rx="12" fill="url(#silver)" />
    <line x1="160" y1="210" x2="340" y2="210" stroke="#9ca3af" stroke-width="2" />
    
    <!-- Jar Body -->
    <path d="M 140 220 L 155 365 C 158 385, 342 385, 345 365 L 360 220 Z" fill="url(#jar)" />
    
    <!-- Jar Label -->
    <rect x="175" y="250" width="150" height="90" rx="8" fill="#ffffff" />
    <text x="250" y="278" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#be185d" text-anchor="middle" letter-spacing="2">GLOW RADIANCE</text>
    <text x="250" y="302" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#111827" text-anchor="middle">FACE CREAM</text>
    <line x1="205" y1="312" x2="295" y2="312" stroke="#f472b6" stroke-width="2" />
    <text x="250" y="328" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#6b7280" text-anchor="middle">DEEP GLOW &amp; MOISTURE</text>

    <!-- Glass Reflection -->
    <path d="M 160 230 L 170 360" stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity="0.7" />
  </g>
  <!-- Petal Accent -->
  <path d="M 360 170 C 390 160, 410 180, 400 200 C 380 200, 370 180, 360 170 Z" fill="#f43f5e" opacity="0.8" />
</svg>
