<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff7ed" />
      <stop offset="100%" stop-color="#ffedd5" />
    </linearGradient>
    <linearGradient id="soapGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="50%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#7c2d12" flood-opacity="0.25" />
    </filter>
  </defs>
  <rect width="500" height="500" fill="url(#bg)" rx="24" />
  <!-- Studio Pedestal -->
  <ellipse cx="250" cy="380" rx="180" ry="40" fill="#fed7aa" opacity="0.6" />
  <ellipse cx="250" cy="375" rx="140" ry="25" fill="#ea580c" opacity="0.15" />
  
  <!-- Soap Bar -->
  <g filter="url(#shadow)">
    <rect x="130" y="160" width="240" height="180" rx="36" fill="url(#soapGrad)" />
    <!-- Embossed Stamp -->
    <rect x="160" y="195" width="180" height="110" rx="20" fill="none" stroke="#fdba74" stroke-width="3" stroke-dasharray="6 4" opacity="0.8" />
    <text x="250" y="245" font-family="system-ui, sans-serif" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="3">GLOW CITRUS</text>
    <text x="250" y="275" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#ffedd5" text-anchor="middle" letter-spacing="1">NATURAL EXTRACT</text>
  </g>

  <!-- Citrus slice accent -->
  <circle cx="140" cy="330" r="45" fill="#f97316" stroke="#fff" stroke-width="4" opacity="0.9" />
  <circle cx="140" cy="330" r="38" fill="#fdba74" stroke="#f97316" stroke-width="2" />
  <path d="M 140 295 L 140 365 M 105 330 L 175 330 M 115 305 L 165 355 M 115 355 L 165 305" stroke="#f97316" stroke-width="3" />

  <!-- Botanical Leaf -->
  <path d="M 340 140 C 370 120, 400 130, 410 160 C 400 180, 360 180, 340 140 Z" fill="#15803d" />
  <path d="M 345 145 Q 375 150 405 160" stroke="#86efac" stroke-width="2" fill="none" />
</svg>
