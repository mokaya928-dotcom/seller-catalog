<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="100%" stop-color="#fef3c7" />
    </linearGradient>
    <linearGradient id="oil" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="40%" stop-color="#fde68a" />
      <stop offset="80%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="50%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#78350f" flood-opacity="0.25" />
    </filter>
  </defs>
  <rect width="500" height="500" fill="url(#bg)" rx="24" />
  <!-- Studio Pedestal -->
  <ellipse cx="250" cy="415" rx="175" ry="34" fill="#fde68a" opacity="0.6" />
  <ellipse cx="250" cy="410" rx="125" ry="18" fill="#d97706" opacity="0.2" />

  <g filter="url(#shadow)">
    <!-- Dropper / Gold Cap -->
    <rect x="238" y="90" width="24" height="35" rx="8" fill="#1f2937" />
    <rect x="215" y="125" width="70" height="35" rx="6" fill="url(#gold)" />

    <!-- Glass Flacon -->
    <path d="M 215 160 C 215 160, 175 190, 175 240 L 175 390 C 175 405, 325 405, 325 390 L 325 240 C 325 190, 285 160, 285 160 Z" fill="url(#oil)" />

    <!-- Minimal Modern Label -->
    <rect x="195" y="235" width="110" height="120" rx="10" fill="#ffffff" opacity="0.95" />
    <text x="250" y="265" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#b45309" text-anchor="middle" letter-spacing="2">ORGANIC</text>
    <text x="250" y="290" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#111827" text-anchor="middle">BODY OIL</text>
    <line x1="215" y1="300" x2="285" y2="300" stroke="#f59e0b" stroke-width="2" />
    <text x="250" y="322" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#4b5563" text-anchor="middle">GOLDEN GLOW</text>
    <text x="250" y="338" font-family="system-ui, sans-serif" font-size="8" font-weight="500" fill="#9ca3af" text-anchor="middle">100 ML / 3.4 FL OZ</text>

    <!-- Glass reflections -->
    <path d="M 188 220 L 188 380" stroke="#ffffff" stroke-width="7" stroke-linecap="round" opacity="0.7" />
  </g>
  <!-- Oil Droplet Accent -->
  <path d="M 370 200 C 370 200, 390 230, 390 245 C 390 256, 381 265, 370 265 C 359 265, 350 256, 350 245 C 350 230, 370 200, 370 200 Z" fill="#f59e0b" opacity="0.85" />
</svg>
