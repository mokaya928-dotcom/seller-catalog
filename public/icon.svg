<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="20" y="20" width="472" height="472" rx="100" fill="url(#bgGrad)" stroke="#f59e0b" stroke-width="8" />

  <!-- Bag Handles -->
  <path d="M206 180 A50 55 0 0 1 306 180" fill="none" stroke="#d97706" stroke-width="18" stroke-linecap="round" />

  <!-- Bag Body -->
  <rect x="146" y="170" width="220" height="230" rx="32" fill="url(#goldGrad)" filter="url(#shadow)" />

  <!-- Center Star ✦ -->
  <path d="M256 235 Q256 280 300 280 Q256 280 256 325 Q256 280 212 280 Q256 280 256 235 Z" fill="#ffffff" />

  <!-- Satellites -->
  <circle cx="320" cy="225" r="8" fill="#ffffff" />
  <circle cx="190" cy="240" r="6" fill="#ffffff" />
  <circle cx="325" cy="330" r="5" fill="#ffffff" />
</svg>
